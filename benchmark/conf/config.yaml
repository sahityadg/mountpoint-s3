# Main configuration file for benchmarks
defaults:
  - _self_

# ===== Common parameters for all benchmarks =====
s3_bucket: ???

application_workers: 1
iterations: 1
run_time: 30  # Default run time in seconds
read_part_size: !!null
write_part_size: 16777216  # 16 MiB, to allow for uploads of large files
read_size: 262144  # 256 KiB
object_size_in_gib: 100  # Size of the object to benchmark
# When specifying object keys via the command line,  quote the list to
# prevent Hydra from treating a comma-separated value as a separate
# item to iterate through. Currently, fio bencmarks don't use this.
objects: !!null

# Network configuration
network:
  interface_names: []
  maximum_throughput_gbps: !!null

# Monitoring options (common to all benchmarks)
monitoring:
  with_bwm: false
  with_perf_stat: false

# ===== Mountpoint configuration =====
mountpoint:
  prefix: !!null
  metadata_ttl: "indefinite"
  mountpoint_max_background: !!null
  mountpoint_congestion_threshold: !!null
  mountpoint_binary: !!null
  upload_checksums: !!null
  stub_mode: "off"  # Options: "off", "fs_handler", "s3_client"
  mountpoint_debug: false
  mountpoint_debug_crt: false

# ===== Benchmark-specific configurations =====
benchmarks:
  # FIO benchmark configuration
  fio:
    fuse_threads: !!null
    direct_io: false
    fio_benchmarks:
      - sequential_read
    fio_benchmark: "${benchmarks.fio.fio_benchmarks[0]}"
    fio_io_engine: "psync"

  # Prefetch benchmark configuration
  prefetch:
    max_memory_target: !!null
    # When specifying object keys via the command line,  quote the list to
    # prevent Hydra from treating ach comma-separated value as a separate
    # item to iterate through like

  # CRT benchmark configuration
  crt:
    crt_benchmarks_path: !!null
    crt_benchmark: "${benchmarks.crt.crt_benchmarks[0]}"


# Default benchmark type - will be overridden by command line or multirun config
benchmark_type: "fio"  # Supported: "fio", "prefetch"

# ===== Hydra configuration =====
hydra:
  help:
    app_name: "Mountpoint benchmark runner"
  mode: MULTIRUN
  job:
    chdir: true
  sweeper:
    # Global sweeper params - use this for common parameters across all benchmarks
    # For specific parameter use sweep params under the specific benchmark type config
    params:
      'application_workers': 1, 16, 64
      '+iteration': "range(${iterations})"

# ===== Separate multirun configurations =====
fio_multirun:
  benchmark_type: fio
  hydra:
    sweeper:
      params:
        'benchmarks.fio.direct_io': false, true

prefetch_multirun:
  benchmark_type: prefetch
  hydra:
    sweeper:
      params:
        # 'benchmarks.prefetch.max_memory_target': !!null, 1073741824, 2147483648  # null, 1GB, 2GB
