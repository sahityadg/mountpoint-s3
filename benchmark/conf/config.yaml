# This file contains default values for the benchmark configuration,
# as well as some which will be 'swept' over for experiments.

defaults:
  - _self_

benchmark_type: "fio"  # Options: fio, prefetch_benchmark, client_benchmark, crt_benchmark

s3_bucket: ???
s3_prefix: !!null

# Common parameters for all benchmarks
application_workers: 1
object_size: "100GiB"
part_size: 8388608  # 8 MiB
read_size: 262144  # 256 KiB
maximum_throughput_gbps: !!null
crt_memory_limit_gib: !!null
read_part_size: !!null
write_part_size: 16777216 # to allow for uploads of 100GiB
run_time: 30  # Default run time in seconds

# Mount-s3 specific parameters (used when mounting S3 bucket for FIO benchmarks)
mount_s3:
  metadata_ttl: "indefinite"
  mountpoint_max_background: !!null
  mountpoint_congestion_threshold: !!null
  mountpoint_binary: !!null
  upload_checksums: !!null
  stub_mode: "off" # fs_handler
  mountpoint_debug: false
  mountpoint_debug_crt: false

fio_benchmarks:
  - sequential_read

# No configuration out of the box, use defaults.
network:
  interface_names: []
  maximum_throughput_gbps: !!null

iterations: 1 

# For monitoring network bandwidth
with_bwm: false
# For gathering performance counter statistics
with_perf_stat: false

# Benchmark-specific configurations
benchmarks:
  fio:
    fuse_threads: 1  # Default value, will be overridden by hydra sweeper
    direct_io: false  # Default value, will be overridden by hydra sweeper
    fio_benchmark: "${fio_benchmarks[0]}"
    fio_benchmarks:
      - sequential_read
    fio_io_engine: "psync"
    iteration: 0
  
  prefetch:
    # Prefetch-specific parameters
    max_memory_target: !!null  # Memory target for prefetching

hydra:
  help:
    app_name: benchmark
    header: |
      Benchmark for Mountpoint for Amazon S3
  mode: MULTIRUN
  job:
    chdir: true
  sweeper:
    params:
      # Common parameters for all benchmark types
      'application_workers': 1, 16, 64
      '+iteration': "range(${iterations})"
      'benchmark_type': "prefetch_benchmark"
      
      # Conditional parameters based on benchmark type
      # These will only be used when the corresponding benchmark type is selected
      'benchmarks.fio.fuse_threads': 1, 16
      'benchmarks.fio.direct_io': false, true
      'benchmarks.fio.fio_benchmark': "${join:',', ${fio_benchmarks}}"
